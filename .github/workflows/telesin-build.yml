name: Build Telesin Auto Rotate APK
on:
  push:
    branches:
      - telesin/**
    paths:
      - 'telesin-controller/**'
      - '.github/workflows/telesin-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p telesin-controller --no-daemon :app:assembleDebug
      - run: cp telesin-controller/app/build/outputs/apk/debug/app-debug.apk TELESIN_AutoRotate_v0.1_test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TELESIN_AutoRotate_v0.1_test
          path: TELESIN_AutoRotate_v0.1_test.apk
          retention-days: 14
