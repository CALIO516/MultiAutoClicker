plugins { id 'com.android.application' }

android {
    namespace 'com.pixelmatrix.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pixelmatrix.studio.stable'
        minSdk 26
        targetSdk 34
        versionCode 28
        versionName '2.8.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // Optional parallel-install build preserves the existing stable app.
            if (project.hasProperty('sideBySide')) applicationIdSuffix '.carousel'
        }
        release { minifyEnabled false }
    }
}