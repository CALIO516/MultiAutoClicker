name: PixelMatrix Studio v2.2 APK
on:
  push:
    branches: [pixelmatrix-studio-apk-build]
    paths:
      - 'pixelmatrix/**'
      - '.github/workflows/pixelmatrix-apk-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pixelmatrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install licensed artwork build tool
        run: python3 -m pip install --quiet --user pillow
      - name: Download CC0 source sprites
        run: |
          mkdir -p /tmp/pm_packs
          git clone --depth 1 https://github.com/marpor/PixelAdventure.git /tmp/pm_packs/frog
          git clone --depth 1 https://github.com/pixel-boy/NinjaAdventure.git /tmp/pm_packs/ninja
      - name: Build CC0 sprite bases
        run: python3 tools/generate_premium_gallery.py --frog /tmp/pm_packs/frog --ninja /tmp/pm_packs/ninja --output app/src/main/assets/gallery
      - name: Create 10 categories of 20 LED-ready animations
        run: python3 tools/curate_v22_gallery.py
      - name: Validate 200 GIFs, categories, bridge and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import json, re
          base=Path('app/src/main/assets');c=json.loads((base/'gallery-catalog.json').read_text())
          assert len(c['samples'])==200 and len(c['categories'])==10
          assert all(x['count']==20 for x in c['categories'])
          counts=Counter(x['category'] for x in c['samples'])
          assert len(counts)==10 and all(n==20 for n in counts.values())
          for entry in c['samples']:
              assert re.fullmatch(r'v22/pixel_\d{3}\.gif',entry['file'])
              with Image.open(base/'gallery'/entry['file']) as im:
                  assert im.size==(64,64) and im.n_frames==8
          assert 'v22/pixel_' in Path('app/src/main/java/com/pixelmatrix/studio/MainActivity.java').read_text()
          assert "versionName '2.2.0'" in Path('app/build.gradle').read_text()
          assert 'v2.2</span>' in (base/'index.html').read_text()
          print('PASS: 200 eight-frame GIFs; 10*20 catalog; native asset bridge; v2.2 labels')
          PY
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v2.2-APK
          path: pixelmatrix/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v2.2-GIF200
          path: pixelmatrix/PixelMatrix_Studio_v2.2_GIF_200.zip
          retention-days: 30