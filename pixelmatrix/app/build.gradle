plugins { id 'com.android.application' }

android {
    namespace 'com.pixelmatrix.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pixelmatrix.studio.stable'
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName '2.7.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stableDebug {
            storeFile file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'pixelmatrix'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
        release { minifyEnabled false }
    }
}