name: PixelMatrix Studio 2.3 APK Build
on:
  push:
    branches: [pixelmatrix-studio-apk-build]
    paths:
      - 'pixelmatrix/**'
      - '.github/workflows/pixelmatrix-apk-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pixelmatrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract polished GIF artpack
        run: |
          rm -rf app/src/main/assets/gallery/v22
          mkdir -p app/src/main/assets/gallery/v22
          cat artpacks/v23.*.bin > premium_artpack_v23.tar.xz
          tar -xJf premium_artpack_v23.tar.xz -C app/src/main/assets/gallery/v22
      - name: Verify sample animations and application version
        run: |
          python3 -m pip install --quiet --user pillow
          python3 - <<'PYV'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('app/src/main/assets')
          cat=json.loads((root/'gallery-catalog.json').read_text())
          assert len(cat['categories'])==10 and len(cat['samples'])==200
          assert all(c['count']==20 for c in cat['categories'])
          for s in cat['samples']:
              p=root/'gallery'/s['file']
              assert p.is_file(), p
              with Image.open(p) as im: assert im.size==(64,64) and im.n_frames==8, p
          assert "versionName '2.3.0'" in Path('app/build.gradle').read_text()
          assert 'PixelMatrix Studio 2.3' in Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'v2.3' in (root/'index.html').read_text()
          print('PASS: 200 GIFs, 8 frames each, 10 categories, version 2.3.0')
          PYV
      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v2.3-CompiledAPK
          path: pixelmatrix/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30