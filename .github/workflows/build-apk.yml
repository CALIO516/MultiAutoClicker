name: Build Installable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'README.txt')"
          echo '' | base64 -d > 'README.txt'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo '' | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          echo 'IyBObyBjdXN0b20gcnVsZXMgcmVxdWlyZWQuCg==' | base64 -d > 'app/proguard-rules.pro'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/example/multiautoclicker/AutoClickAccessibilityService.java')"
          echo '' | base64 -d > 'app/src/main/java/com/example/multiautoclicker/AutoClickAccessibilityService.java'
          mkdir -p "$(dirname 'app/src/main/java/com/example/multiautoclicker/MainActivity.java')"
          echo '' | base64 -d > 'app/src/main/java/com/example/multiautoclicker/MainActivity.java'
          mkdir -p "$(dirname 'app/src/main/java/com/example/multiautoclicker/OverlayService.java')"
          echo '' | base64 -d > 'app/src/main/java/com/example/multiautoclicker/OverlayService.java'
          mkdir -p "$(dirname 'app/src/main/java/com/example/multiautoclicker/Prefs.java')"
          echo '' | base64 -d > 'app/src/main/java/com/example/multiautoclicker/Prefs.java'
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_foreground.xml')"
          echo '' | base64 -d > 'app/src/main/res/drawable/ic_launcher_foreground.xml'
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          echo '' | base64 -d > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml'
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml')"
          echo '' | base64 -d > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/colors.xml')"
          echo 'PHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJwcmltYXJ5Ij4jNEU2QkZGPC9jb2xvcj4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > 'app/src/main/res/values/colors.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/ic_launcher_background.xml')"
          echo 'PHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJpY19sYXVuY2hlcl9iYWNrZ3JvdW5kIj4jNEU2QkZGPC9jb2xvcj4KPC9yZXNvdXJjZXM+Cg==' | base64 -d > 'app/src/main/res/values/ic_launcher_background.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo 'PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPuupgO2LsCDsmKTthqA8L3N0cmluZz4KICAgIDxzdHJpbmcgbmFtZT0iYWNjZXNzaWJpbGl0eV9zZXJ2aWNlX2Rlc2NyaXB0aW9uIj7sgqzsmqnsnpDqsIAg7KeA7KCV7ZWcIO2ZlOuptCDsooztkZzsl5Ag67CY67O1IO2EsOy5mCDsoJzsiqTsspjrpbwg7Iuk7ZaJ7ZWp64uI64ukLjwvc3RyaW5nPgo8L3Jlc291cmNlcz4K' | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo '' | base64 -d > 'app/src/main/res/values/styles.xml'
          mkdir -p "$(dirname 'app/src/main/res/xml/accessibility_service_config.xml')"
          echo '' | base64 -d > 'app/src/main/res/xml/accessibility_service_config.xml'
          mkdir -p "$(dirname 'build.gradle')"
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiAutoClicker-v1.3.0-APK
          path: app/build/outputs/apk/debug/*.apk
