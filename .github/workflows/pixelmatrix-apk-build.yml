name: PixelMatrix Studio stable APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pixelmatrix/**'
      - '.github/workflows/pixelmatrix-apk-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixelmatrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore packaged GIF assets
        run: |
          cat artpacks/v28.*.bin > /tmp/pixelmatrix-gifs.tar.xz
          tar -xJf /tmp/pixelmatrix-gifs.tar.xz -C app/src/main/assets/
      - name: Restore persistent signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: pixelmatrix-stable-signing-key-2026-10-19-v1
      - name: Check gallery and Android version
        run: |
          python3 - <<'PYV'
          import json,pathlib,re
          r=pathlib.Path('app/src/main/assets');c=json.loads((r/'gallery-catalog.json').read_text())
          assert len(c['samples'])==200 and len(c['categories'])==10
          assert all((r/'gallery'/s['file']).is_file() for s in c['samples'])
          a=pathlib.Path('app/build.gradle').read_text()
          assert "applicationId 'com.pixelmatrix.studio.stable'" in a
          assert 'versionCode 3300' in a and "versionName '3.3.0'" in a
          b=(r/'index.html').read_text()
          assert 'commitEditBtn' in b and 'discardEditBtn' in b and 'decodeGifFrames' in b and 'libraryGifFile' in b and 'gifLibraryDirectBtn' in b
          print('Gallery, edit-mode, GIF decoder, version consistent')
          PYV
      - name: Validate JavaScript without launching app
        run: |
          python3 - <<'PYJS'
          import pathlib,re
          content=pathlib.Path('app/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',content,re.S)
          assert len(blocks)==1
          pathlib.Path('/tmp/pixelmatrix-ui-check.js').write_text(blocks[0])
          PYJS
          node --check /tmp/pixelmatrix-ui-check.js
      - run: gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
      - name: Cache signing key for compatible subsequent updates
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: pixelmatrix-stable-signing-key-2026-10-19-v1
      - name: Android package verify
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pixelmatrix-badging.txt | head -n 12
          grep -q "name='com.pixelmatrix.studio.stable'" /tmp/pixelmatrix-badging.txt
          grep -q "versionName='3.3.0'" /tmp/pixelmatrix-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v3.3-APK
          path: pixelmatrix/app/build/outputs/apk/debug/app-debug.apk

      - name: Build clean-install companion package
        run: |
          gradle :app:assembleDebug -PcleanInstall=true --no-daemon
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/clean-badging.txt | head -n 12
          grep -q "name='com.pixelmatrix.studio.stable.clean'" /tmp/clean-badging.txt
          grep -q "versionName='3.3.0'" /tmp/clean-badging.txt
          mkdir -p app/build/clean-install
          cp "$APK" app/build/clean-install/PixelMatrixStudio-v3.3-Clean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v3.3-Clean-APK
          path: pixelmatrix/app/build/clean-install/PixelMatrixStudio-v3.3-Clean.apk