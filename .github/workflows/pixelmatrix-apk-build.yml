name: PixelMatrix Studio v2.8 carousel build
on:
  workflow_dispatch:
  push:
    paths: ['pixelmatrix/**', '.github/workflows/pixelmatrix-apk-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixelmatrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore bundled 200 animations
        run: |
          cat artpacks/v28.*.bin > /tmp/pixelmatrix_gallery_v28.tar.xz
          tar -xJf /tmp/pixelmatrix_gallery_v28.tar.xz -C app/src/main/assets/
      - name: Validate gallery and version
        run: |
          python3 - <<'PYV'
          import json, pathlib
          r=pathlib.Path('app/src/main/assets')
          c=json.loads((r/'gallery-catalog.json').read_text())
          assert len(c['samples'])==200 and len(c['categories'])==10
          for s in c['samples']:
              assert (r/'gallery'/s['file']).is_file(),s['file']
          g=pathlib.Path('app/build.gradle').read_text()
          assert "applicationId 'com.pixelmatrix.studio.stable'" in g
          assert 'versionCode 28' in g and "versionName '2.8.0'" in g
          assert all((r/'gallery'/x['file']).read_bytes()[:6] in (b'GIF87a', b'GIF89a') for x in c['samples'])
          print('200 samples, GIF headers and version OK')
          PYV
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PYJS'
          import re, pathlib
          h=(pathlib.Path('app/src/main/assets/index.html')).read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',h, re.S)
          assert len(scripts)==1
          pathlib.Path('/tmp/pixelmatrix-ui-v28.js').write_text(scripts[0])
          PYJS
          node --check /tmp/pixelmatrix-ui-v28.js
      - run: gradle :app:clean :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pixelmatrix_apk_badging.txt | head -n 12
          grep -q "name='com.pixelmatrix.studio.stable'" /tmp/pixelmatrix_apk_badging.txt
          grep -q "versionName='2.8.0'" /tmp/pixelmatrix_apk_badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PixelMatrixStudio-v2.8-APK
          path: pixelmatrix/app/build/outputs/apk/debug/app-debug.apk