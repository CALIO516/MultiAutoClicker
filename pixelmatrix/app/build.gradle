plugins { id 'com.android.application' }

android {
    namespace 'com.pixelmatrix.studio'
    compileSdk 35
    defaultConfig {
        applicationId project.hasProperty('compat31') ? 'com.pixelmatrix.studio.moti31' : 'com.pixelmatrix.studio.stable'
        if (project.hasProperty('cleanInstall')) applicationIdSuffix '.clean'
        minSdk 26
        targetSdk 34
        versionCode 4000
        versionName '4.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}