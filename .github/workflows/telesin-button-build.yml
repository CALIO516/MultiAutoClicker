name: Build TELESIN Button Rotate
on:
  push:
    branches:
      - 'telesin/button-rotate-v03'
    paths:
      - 'telesin-button-rotate/**'
      - '.github/workflows/telesin-button-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p telesin-button-rotate --no-daemon :app:assembleDebug
      - run: cp telesin-button-rotate/app/build/outputs/apk/debug/app-debug.apk TELESIN_ButtonRotate_v0.3_test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TELESIN_ButtonRotate_v0.3_test
          path: TELESIN_ButtonRotate_v0.3_test.apk
          retention-days: 14
