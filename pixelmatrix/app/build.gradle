plugins { id 'com.android.application' }

android {
    namespace 'com.pixelmatrix.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pixelmatrix.studio.v24'
        minSdk 26
        targetSdk 34
        versionCode 24
        versionName '2.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}